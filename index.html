<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YCÔNE-Sens 2026</title>

<style>

/* =========================
    VARIABLES
   ========================= */

:root {
    --fond: #f4f4f4;
    --fond-carte: #ffffff;
    --texte: #222;
    --bordure: #cccccc;
    --bouton: #e8e8e8;
    --bouton-hover: #d5d5d5;
    --accent: #2563eb;
    --accent-texte: #ffffff;
    --ombre: 0 2px 6px rgba(0,0,0,0.10);
}


/* =========================
    MODE SOMBRE
   ========================= */

@media (prefers-color-scheme: dark) {

    :root {
        --fond: #181818;
        --fond-carte: #242424;
        --texte: #eeeeee;
        --bordure: #444444;
        --bouton: #333333;
        --bouton-hover: #444444;
        --accent: #4d8dff;
        --accent-texte: #ffffff;
        --ombre: 0 2px 6px rgba(0,0,0,0.35);
    }

}


/* =========================
    PAGE
   ========================= */

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--fond);
    color: var(--texte);
}


/* =========================
    CONTENEUR
   ========================= */

.conteneur {
    max-width: 1000px;
    margin: auto;
}

    /* Alignement horizontal de l'icône et des titres */
    .header-container {
        display: flex;
        align-items: center; /* Aligne verticalement l'icône et le texte au centre */
        gap: 15px;           /* Crée un espace de 15px entre l'icône et les titres */
        padding: 10px;       /* Optionnel : ajoute un peu d'espace autour du bloc */
    }

    /* Optionnel : Remise à zéro des marges des titres pour éviter les décalages */
    .titles-block h1, 
    .titles-block h2 {
        margin: 0;
    }

    /* Optionnel : Un petit espace sous le H1 si vous le souhaitez */
    .titles-block h1 {
        margin-bottom: 4px;
    }
/* =========================
    TITRE
   ========================= */

h1 {
    text-align: center;
    margin: 10px 0 25px 0;
    font-size: 28px;
}


/* =========================
    CHOIX DE L'ANNÉE
   ========================= */

.annee {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
}

select {
    font-size: 18px;
    padding: 10px 35px 10px 15px;
    border: 1px solid var(--bordure);
    border-radius: 8px;
    background: var(--fond-carte);
    color: var(--texte);
    cursor: pointer;
}


/* =========================
    GRILLE DES MOIS
   ========================= */

.mois {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}


/* =========================
    BOUTONS
   ========================= */

.mois a {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 65px;

    text-decoration: none;
    font-size: 17px;
    font-weight: bold;

    color: var(--texte);
    background: var(--bouton);

    border: 1px solid var(--bordure);
    border-radius: 10px;

    box-shadow: var(--ombre);

    transition:
        background 0.15s,
        transform 0.15s;
}


/* Souris */

.mois a:hover {
    background: var(--bouton-hover);
    transform: translateY(-2px);
}


/* Clic */

.mois a:active {
    transform: translateY(0);
}


/* =========================
    MOIS EN COURS
   ========================= */

.mois a.actuel {
    background: var(--accent);
    color: var(--accent-texte);
    border-color: var(--accent);
}


/* =========================
    MOIS INDISPONIBLE
   ========================= */

.mois a.inactif {
    opacity: 0.35;
    pointer-events: none;
}


/* =========================
    TABLETTE
   ========================= */

@media (max-width: 800px) {

    .mois {
        grid-template-columns: repeat(3, 1fr);
    }

}


/* =========================
    TÉLÉPHONE
   ========================= */

@media (max-width: 500px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .mois {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .mois a {
        min-height: 60px;
        font-size: 15px;
    }

    select {
        font-size: 16px;
    }

}

    .mon-icone {
        /* Définissez la taille de votre choix ici */
        width: 50px; 
        height: 50px;        
        /* Optionnel : garantit que le ratio carré (1:1) reste parfait */
        aspect-ratio: 1 / 1;    
    }
</style>
</head>


<body>

<div class="conteneur">
    <header class="header-container">
    <!-- Votre icône SVG -->
    <svg class="mon-icone" width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- vector-effect ajouté pour garder des bordures proportionnelles -->
        <rect x="10" y="10" width="180" height="180" fill="#f3f1e9" stroke="#453cf4" stroke-width="2" />
        <rect x="25" y="25" width="150" height="150" fill="none" stroke="#453cf4" stroke-width="14"  />
        <polygon points="25,175 25,28 170,175" fill="#453cf4"/>
        <g fill="#453cf4">
        <text x="66" y="65" font-family="'Fancy', 'Helvetica Neue', Arial, sans-serif" font-weight="1000" font-size="25" letter-spacing="0">ƳᑕÔᑎᗴ</text>      
        <text x="98" y="90" font-family="'Fancy', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="-1">Sens</text>
        </g> 
    </svg>
    <!-- Le bloc contenant vos titres -->
    <div class="titles-block">    

    <h1>HISTORIQUE</h1>
    </div>
    </header>

    <!-- =======================
        CHOIX DE L'ANNÉE
        ===================== -->

    <div class="annee">

        <select id="annee" onchange="changerAnnee()">

            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>

        </select>

    </div>


    <!--=====================
        MOIS
        ===================== -->

    <div class="mois">

        <a href="https://erikpier2.github.io/ycone_resultats_01/">JANVIER</a>

        <a href="https://erikpier2.github.io/ycone_resultats_02/">FÉVRIER</a>

        <a href="historique/2026/03.html">MARS</a>

        <a href="historique/2026/04.html">AVRIL</a>

        <a href="historique/2026/05.html">MAI</a>

        <a href="historique/2026/06.html">JUIN</a>

        <a href="historique/2026/07.html">JUILLET</a>

        <a href="https://erikpier2.github.io/ycone_resultats_08/">AOÛT</a>

        <a href="https://erikpier2.github.io/ycone_resultats_09/">SEPTEMBRE</a>

        <a href="https://erikpier2.github.io/ycone_resultats_10/">OCTOBRE</a>

        <a href="historique/2026/11.html">NOVEMBRE</a>

        <a href="historique/2026/12.html">DÉCEMBRE</a>

    </div>

</div>


<script>

/* =========================
    CHANGEMENT D'ANNÉE
   ========================= */

function changerAnnee() {

    const annee = document.getElementById("annee").value;

    const liens = document.querySelectorAll(".mois a");

    liens.forEach(function(lien, index) {

        let mois = String(index + 1).padStart(2, "0");

        lien.href =
            "historique/" + annee + "/" + mois + ".html";

    });

}

</script>

</body>
</html>
